[platformio]
default_envs = waveshare_esp32s3_lcd7_8mb
; default_envs = waveshare_esp32s3_lcd7_16mb

; Gemeinsame Einstellungen fuer alle Environments.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
build_type = release

board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.psram = enabled
board_build.f_flash = 80000000L

extra_scripts =
  pre:scripts/generate_html_header.py
  pre:scripts/fw_version.py

upload_speed = 921600
monitor_speed = 115200
monitor_raw = yes

lib_deps =
  lovyan03/LovyanGFX@1.2.27
  bitbank2/JPEGDEC@1.8.4
  bblanchon/ArduinoJson@7.4.3
  mathieucarbou/ESPAsyncWebServer@3.6.0
  xreef/SimpleFTPServer@3.0.1

build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -O2
  -flto

build_flags =
  -DLOGGER_ENABLED=1
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM
  -O2
  -Wno-attributes
  -Wno-deprecated-declarations
  -DDEFAULT_STORAGE_TYPE_ESP32=STORAGE_SD
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; Variante mit 8MB Flash
[env:waveshare_esp32s3_lcd7_8mb]
board = waveshare_esp32s3_lcd7_8mb
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions_8mb.csv

; Variante mit 16MB Flash
[env:waveshare_esp32s3_lcd7_16mb]
board = waveshare_esp32s3_lcd7_16mb
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv


; Audio-Library
; Das Projekt verwendet die modifizierte audio-lite unter lib/audio-lite.
; Die Library ist vollständig im Repository enthalten; manuelle Patches nach dem Build sind nicht erforderlich.
; Funktionsschalter stehen in lib/audio-lite/src/AudioConfig.h, Herkunft und Änderungen in lib/audio-lite/README.md.
